
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScamPulse AI Dashboard</title>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px;
    background: #f4f6f8;
    font-family: Arial, Helvetica, sans-serif;
}

.dashboard {
    max-width: 1500px;
    margin: 0 auto;
}

.header {
    text-align: center;
    margin-bottom: 24px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.header p {
    margin: 6px 0 0;
    font-size: 14px;
}

.kpi-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
    margin-bottom: 18px;
}

.kpi {
    background: white;
    border-radius: 10px;
    padding: 18px 12px;
    text-align: center;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.kpi .label {
    font-size: 12px;
    margin-bottom: 10px;
}

.kpi .value {
    font-size: 25px;
    font-weight: 700;
}

.card {
    background: white;
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 16px;
    overflow: hidden;
}

.daily {
    width: 100%;
}

.subjects,
.robocall,
.geo,
.phones {
    display: inline-block;
    vertical-align: top;
    width: calc(50% - 10px);
}

.subjects {
    margin-right: 16px;
}

.emerging-subjects,
.emerging-states,
.emerging-phones {
    display: inline-block;
    vertical-align: top;
    width: calc(33.333% - 12px);
}

.emerging-subjects,
.emerging-states {
    margin-right: 12px;
}

@media (max-width: 1100px) {
    .kpi-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .subjects,
    .robocall,
    .geo,
    .phones {
        width: 100%;
        margin-right: 0;
    }

    .emerging-subjects,
    .emerging-states,
    .emerging-phones {
        width: 100%;
        margin-right: 0;
    }
}

@media (max-width: 650px) {
    body {
        padding: 10px;
    }

    .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .header h1 {
        font-size: 24px;
    }
}
</style>
</head>
